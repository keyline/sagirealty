<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071d3b">
  <title>Thank You | SAGI Realty</title>
  <link rel="icon" type="image/png" href="assets/sagi-realty-logo.png">
  <link rel="apple-touch-icon" href="assets/sagi-realty-logo.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body{min-height:100vh;background:linear-gradient(135deg,#061a35,#123f70);display:grid;place-items:center;color:#fff}
    .thank-card{width:min(560px,calc(100% - 30px));background:#fff;color:#122038;border-radius:28px;padding:50px 35px;text-align:center;box-shadow:0 35px 100px rgba(0,0,0,.25)}
    .check{width:74px;height:74px;margin:0 auto 22px;border-radius:50%;background:#f7e7b9;color:#8b651a;display:grid;place-items:center;font-size:35px}
    .thank-card h1{font:46px/1 Georgia,serif;color:#071d3b;margin:0 0 15px}
    .thank-card p{color:#697487;font-size:14px;margin:0 auto 25px;max-width:430px}
  </style>
</head>
<body>
  <main class="thank-card">
    <div class="check">✓</div>
    <h1>Thank You</h1>
    <p>Your enquiry has been received. Our project team will contact you with the latest details, availability and pricing.</p>
    <a href="index.html" class="btn btn-primary">Back to Website <span>→</span></a>
  </main>
</body>
</html>
